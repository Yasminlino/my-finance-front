<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <title>Kanfy | Controle financeiro</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/logo_Kanfy_icone_32.png">

  <!-- Atalho na tela inicial: Android lê o manifest (ícones 192/512 e abre como app); iPhone, o apple-touch-icon. -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0b1f4b">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/logo_Kanfy_icone_180.png">
  <meta name="apple-mobile-web-app-title" content="Kanfy">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <script>
    // Card #40: o app deixou de usar "#" nas rotas. Endereços antigos (e-mails, favoritos, atalhos,
    // redirecionamento do GitHub Pages) chegam como "/#/contas-a-pagar" e viram "/contas-a-pagar".
    if (location.hash.indexOf('#/') === 0) {
      history.replaceState(null, '', location.hash.slice(1));
    }
  </script>
</head>

<body>
  <app-root></app-root>
</body>

</html>
