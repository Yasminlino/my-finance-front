<div class="surface-card border-round shadow-1 mb-2">
  <div class="p-3 flex flex-wrap gap-4 align-items-center">
    <div>
      <div class="text-color-secondary text-sm">Receita (Selecionados)</div>
      <div class="font-bold text-xl text-green-600">{{ money(receita) }}</div>
    </div>

    <div class="border-left-1 surface-border align-self-stretch"></div>

    <div>
      <div class="text-color-secondary text-sm">Despesa (Selecionados)</div>
      <div class="font-bold text-xl text-red-500">{{ money(despesa) }}</div>
    </div>

    <div class="border-left-1 surface-border align-self-stretch"></div>

    <div>
      <div class="text-color-secondary text-sm">Saldo (Selecionados)</div>
      <div class="font-bold text-xl" [class.text-red-500]="saldo < 0" [class.text-green-600]="saldo >= 0">
        {{ money(saldo) }}
      </div>
    </div>

    <div class="ml-auto text-color-secondary text-sm">
      {{ count }} {{ count === 1 ? 'item' : 'itens' }} selecionado(s)
    </div>
  </div>
</div>
