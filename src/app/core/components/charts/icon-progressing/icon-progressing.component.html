<div class="me-auto">
    <span class="{{valorPositivo ? 'text-green' : 'text-red'}} d-inline-flex align-items-center lh-1">
        {{porcentagem | number:'1.0-2'}}%
        
        <svg *ngIf="valorPositivo" xmlns="http://www.w3.org/2000/svg" class="icon ms-1" width="24" height="24" viewBox="0 0 24 24"
            stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
            <polyline points="3 17 9 11 13 15 21 7" />
            <polyline points="14 7 21 7 21 14" />
        </svg>
        
        <svg *ngIf="!valorPositivo" xmlns="http://www.w3.org/2000/svg" class="icon ms-1" width="24" height="24" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
            <polyline points="3 7 9 13 13 9 21 15" />
            <polyline points="14 17 21 17 21 10" />
