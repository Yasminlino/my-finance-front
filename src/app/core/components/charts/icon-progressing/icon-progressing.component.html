<div class="mr-auto">
  <span class="inline-flex align-items-center gap-1 line-height-1" [ngClass]="valorPositivo ? 'text-green-600' : 'text-red-500'">
    {{ porcentagem | number:'1.0-2' }}%
    <i class="pi" [ngClass]="valorPositivo ? 'pi-arrow-up-right' : 'pi-arrow-down-right'"></i>
  </span>
</div>
