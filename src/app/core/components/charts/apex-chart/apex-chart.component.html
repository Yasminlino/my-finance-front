<ng-container *ngIf="useCard; else bare">
  <div class="surface-card border-round h-full" [ngClass]="cardClass">
    <div class="px-3 py-2 border-bottom-1 surface-border" *ngIf="titleText">
      <h3 class="text-lg font-semibold m-0">{{ titleText }}</h3>
    </div>

    <div class="p-3 chart-scroll">
      <apx-chart
        [series]="merged.series"
        [chart]="merged.chart"
        [plotOptions]="merged.plotOptions"
        [dataLabels]="merged.dataLabels"
        [grid]="merged.grid"
        [xaxis]="merged.xaxis"
        [yaxis]="merged.yaxis"
        [tooltip]="merged.tooltip"
        [legend]="merged.legend"
        [colors]="merged.colors"
        [fill]="merged.fill"
        [stroke]="merged.stroke"
        [title]="merged.title"
      ></apx-chart>
    </div>
  </div>
</ng-container>

<ng-template #bare>
  <apx-chart
    [series]="merged.series"
    [chart]="merged.chart"
    [plotOptions]="merged.plotOptions"
    [dataLabels]="merged.dataLabels"
    [grid]="merged.grid"
    [xaxis]="merged.xaxis"
    [yaxis]="merged.yaxis"
    [tooltip]="merged.tooltip"
    [legend]="merged.legend"
    [colors]="merged.colors"
    [fill]="merged.fill"
    [stroke]="merged.stroke"
    [title]="merged.title"
  ></apx-chart>
</ng-template>
