<header class="topo">
  <p-menubar [model]="menu" [autoDisplay]="false" styleClass="topo-menubar">
    <ng-template pTemplate="start">
      <a class="marca" routerLink="/home">
        <img src="assets/MyFinance.png" alt="MyFinance" width="32">
        <span>{{ brand }}</span>
      </a>
    </ng-template>

    <ng-template pTemplate="end">
      <a *ngIf="!auth.token" routerLink="/login" class="p-menuitem-link">Login</a>

      <div *ngIf="auth.token" class="usuario">
        <i class="pi pi-user"></i>
        <div class="usuario-nome">
          <div>Usuário</div>
          <small>{{ usuario }}</small>
        </div>
        <p-button label="Sair" icon="pi pi-sign-out" [text]="true" severity="secondary" size="small"
          (onClick)="logout()" />
      </div>
    </ng-template>
  </p-menubar>
</header>
