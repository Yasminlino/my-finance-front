<p-dialog header="Adicionar contas em lote" [visible]="true" [modal]="true" [dismissableMask]="true" [draggable]="false"
  styleClass="mf-dialog-md" (visibleChange)="close(false)">
  <app-data-grid #grid [dataSource]="contas" [columns]="gridColumns" [exibeCampos]="exibirCampos" [loading]="loading"
    [disabledRowIds]="disabledIds" (selectionChange)="onSelectionChange($event)">
  </app-data-grid>

  <ng-template pTemplate="footer">
    <p-button label="Cancelar" severity="secondary" [outlined]="true" (onClick)="close(false)" />
    <p-button label="Salvar selecionados" icon="pi pi-check" [loading]="saving"
      [disabled]="saving || selectedIds.size === 0" (onClick)="handleSave()" />
  </ng-template>
</p-dialog>
