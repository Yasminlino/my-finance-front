<!-- Backdrop -->
<div class="modal-backdrop-custom" (click)="close(false)"></div>

<!-- Modal -->
<div class="modal-custom" role="dialog" aria-modal="true">
    <div class="modal-card card modal-adicionar-em-lote">

        <div class="card-header d-flex justify-content-between align-items-center">
            <h3 class="card-title m-0">Adicionar contas em lote</h3>
            <button type="button" class="btn-close" (click)="close(false)" aria-label="Fechar"></button>
        </div>

        <div class="card-body mb-4 p-0">
            <p-toast></p-toast>
            <app-data-grid #grid [dataSource]="contas" [columns]="gridColumns" [exibeCampos]="exibirCampos" [loading]="loading"
                [disabledRowIds]="disabledIds" (selectionChange)="onSelectionChange($event)">
            </app-data-grid>
        </div>

        <div class="card-footer d-flex justify-content-end gap-2">
            <button type="button" class="btn btn-outline-secondary" (click)="close(false)">Cancelar</button>
            <button type="button" class="btn btn-primary" (click)="handleSave()" [disabled]="saving || selectedIds.size === 0">
                {{ saving ? 'Salvando...' : 'Salvar selecionados' }}
            </button>
        </div>

    </div>
</div>
