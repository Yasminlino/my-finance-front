<p-dialog header="Adicionar nova conta" [visible]="true" [modal]="true" [dismissableMask]="true" [draggable]="false"
  [style]="{ width: '32rem' }" [breakpoints]="{ '576px': '95vw' }" (visibleChange)="close(false)">
  <form [formGroup]="form" class="flex flex-column gap-3" (ngSubmit)="save()">
    <div class="flex flex-column gap-2">
      <label for="cp-nome">Nome conta</label>
      <input pInputText id="cp-nome" formControlName="nomeConta" [class.ng-dirty]="erro('nomeConta')" />
      <small class="p-error" *ngIf="erro('nomeConta')">Informe um nome válido.</small>
    </div>

    <div class="flex flex-column gap-2">
      <label for="cp-valor">Valor</label>
      <input pInputText id="cp-valor" type="text" inputmode="decimal" formControlName="valor" currencyInput
        placeholder="0,00" [class.ng-dirty]="erro('valor')" />
      <small class="p-error" *ngIf="erro('valor')">Informe um valor.</small>
    </div>

    <div class="flex flex-column gap-2">
      <label for="cp-dia">Dia Vencimento</label>
      <input pInputText id="cp-dia" formControlName="dataOperacao" maxlength="2" placeholder="Ex: 10" />
    </div>

    <div class="flex flex-column gap-2">
      <label for="cp-categoria">Categoria</label>
      <p-dropdown inputId="cp-categoria" formControlName="categoryid" [options]="categorias" optionLabel="name"
        optionValue="id" placeholder="Selecione..." appendTo="body" styleClass="w-full"
        [class.ng-dirty]="erro('categoryid')" />
      <small class="p-error" *ngIf="erro('categoryid')">Selecione uma categoria.</small>
    </div>
  </form>

  <ng-template pTemplate="footer">
    <p-button label="Cancelar" severity="secondary" [outlined]="true" (onClick)="close(false)" />
    <p-button label="Salvar" icon="pi pi-check" [loading]="saving" (onClick)="save()" />
  </ng-template>
</p-dialog>
