<p-dialog header="Importações realizadas" [visible]="true" [modal]="true" [dismissableMask]="true" [draggable]="false"
  [style]="{ width: '50vw' }" [breakpoints]="{ '768px': '90vw' }" (visibleChange)="close(false)">
  <app-data-grid #grid [dataSource]="importacaoesMensais" [columns]="gridColumns" [exibeCampos]="exibirCampos"
    [loading]="loading" (delete)="deleteRow($event)">
  </app-data-grid>

  <ng-template pTemplate="footer">
    <p-button label="Fechar" severity="secondary" [outlined]="true" (onClick)="close(false)" />
    <p-button label="Concluir" icon="pi pi-check" (onClick)="close(true)" />
  </ng-template>
</p-dialog>
