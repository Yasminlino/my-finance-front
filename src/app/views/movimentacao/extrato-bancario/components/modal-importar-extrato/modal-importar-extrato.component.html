<div class="modal show d-block" tabindex="-1" role="dialog">
  <div class="modal-dialog modal-md" style="margin-top:100px" role="document">
    <form class="modal-content" [formGroup]="form" (ngSubmit)="salvar()" novalidate>
      <div class="modal-header">
        <h5 class="modal-title">Importar extrato</h5>
        <button type="button" class="btn-close" (click)="cancelar()" [disabled]="importando"></button>
      </div>

      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label" for="ie-banco">Banco</label>
          <select id="ie-banco" class="form-select" formControlName="bancoId" [class.is-invalid]="invalido('bancoId')">
            <option [ngValue]="null">Selecione...</option>
            <option *ngFor="let b of bancos" [ngValue]="b.id">{{ b.nomeBanco }}</option>
          </select>
          <div class="invalid-feedback">Selecione o banco.</div>
        </div>

        <div class="mb-3">
          <label class="form-label" for="ie-tipo-conta">Tipo conta (automático)</label>
          <input id="ie-tipo-conta" type="text" class="form-control" [value]="tipoCartao?.nomeTipoCartao ?? '—'" disabled />
          <small class="text-muted">O tipo de conta é definido pelo banco selecionado.</small>
        </div>

        <div class="mb-2">
          <label class="form-label" for="ie-arquivo">Arquivo</label>
          <input id="ie-arquivo" type="file" class="form-control" accept=".ofx,.csv,.xls,.xlsx,.txt,.pdf"
            (change)="onArquivo($event)" [disabled]="importando" [class.is-invalid]="invalido('arquivo')" />
          <div class="invalid-feedback">Selecione o arquivo.</div>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="cancelar()" [disabled]="importando">Cancelar</button>
        <button type="submit" class="btn btn-primary" [disabled]="importando">
          {{ importando ? 'Importando...' : 'Importar' }}
        </button>
      </div>
    </form>
  </div>
</div>
<div class="modal-backdrop fade show"></div>
