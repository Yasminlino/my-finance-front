<p-dialog header="Importar extrato" [visible]="true" [modal]="true" [closable]="!importando" [draggable]="false"
  styleClass="mf-dialog-sm" (visibleChange)="cancelar()">
  <form [formGroup]="form" class="flex flex-column gap-3" (ngSubmit)="salvar()" novalidate>
    <div class="flex flex-column gap-2">
      <label for="ie-banco">Banco</label>
      <p-dropdown inputId="ie-banco" formControlName="bancoId" [options]="bancos" optionLabel="nomeBanco"
        optionValue="id" placeholder="Selecione..." appendTo="body" styleClass="w-full"
        [class.ng-dirty]="invalido('bancoId')" />
      <small class="p-error" *ngIf="invalido('bancoId')">Selecione o banco.</small>
    </div>

    <div class="flex flex-column gap-2">
      <label for="ie-tipo-conta">Tipo conta (automático)</label>
      <input pInputText id="ie-tipo-conta" type="text" [value]="tipoCartao?.nomeTipoCartao ?? '—'" disabled />
      <small class="text-color-secondary">O tipo de conta é definido pelo banco selecionado.</small>
    </div>

    <div class="flex flex-column gap-2">
      <label for="ie-arquivo">Arquivo</label>
      <input pInputText id="ie-arquivo" type="file" accept=".ofx,.csv,.xls,.xlsx,.txt,.pdf"
        (change)="onArquivo($event)" [disabled]="importando" [class.ng-dirty]="invalido('arquivo')"
        [class.ng-invalid]="invalido('arquivo')" />
      <small class="p-error" *ngIf="invalido('arquivo')">Selecione o arquivo.</small>
    </div>
  </form>

  <ng-template pTemplate="footer">
    <p-button label="Cancelar" severity="secondary" [outlined]="true" [disabled]="importando" (onClick)="cancelar()" />
    <p-button label="Importar" icon="pi pi-upload" [loading]="importando" (onClick)="salvar()" />
  </ng-template>
</p-dialog>
