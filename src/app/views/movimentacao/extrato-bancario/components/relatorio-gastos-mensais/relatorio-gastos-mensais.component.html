<div class="page-wrapper">
  <div class="page-body">
    <div class="container-xl">
      <div class="d-flex align-items-center justify-content-between mb-3">
        <div>
          <div class="text-muted small">Financeiro</div>
          <h3 class="m-0">
            Relatório de gastos mensais
          </h3>
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-outline-secondary" (click)="back()">Voltar</button>
        </div>
      </div>
      <div class="row mb-3">
        <div class="col-12 col-lg-6">
          <app-apex-chart titleText="Bancos ({{ calculaTotal() }})" [options]="relatorioBanco" cardClass="shadow-sm"></app-apex-chart>
        </div>
      </div>
      <div class="row">
        <div class="col-12 col-lg-6">
          <app-apex-chart titleText="Gastos por categoria do mês {{ getMonthName() }}" [options]="gastosPorCategoria" cardClass="shadow-sm"></app-apex-chart>
        </div>
        <div class="col-12 col-lg-6">
          <app-apex-chart titleText="Gastos por Tipo movimentação" [options]="gastosPorTipoMovimentacao" cardClass="shadow-sm"></app-apex-chart>
        </div>
      </div>
    </div>
  </div>
</div>
