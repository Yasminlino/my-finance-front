<p-dialog header="Vínculos cadastrados" [visible]="true" [modal]="true" [dismissableMask]="true" [draggable]="false"
  styleClass="mf-dialog-lg" (visibleChange)="close(false)">
  <app-data-grid #grid [dataSource]="pessoaMovimentacao" [columns]="gridColumns" [exibeCampos]="exibirCampos"
    (new)="addRow()" [loading]="loading" [bloquearLinha]="bloquear" (saveInline)="onSaveInline($event)" (delete)="deleteRow($event)">
  </app-data-grid>

  <ng-template pTemplate="footer">
    <!-- Card #76, fase 2: apagar os nomes que a importação antiga cadastrou como pessoa -->
    <p-button label="Limpar estabelecimentos" icon="pi pi-eraser" severity="secondary" [text]="true" styleClass="mr-auto"
      (onClick)="showLimpar = true" />
    <p-button label="Fechar" severity="secondary" [outlined]="true" (onClick)="close(false)" />
    <p-button label="Concluir" icon="pi pi-check" (onClick)="onSaveAll()" />
  </ng-template>
</p-dialog>

@if (showLimpar) {
  <app-limpar-estabelecimentos (fechado)="aoFecharLimpeza($event)" />
}
