<mf-form-panel [titulo]="'Adicionar lançamento manual' + (ehCredito ? ' (Cartão de crédito)' : '')" tamanho="lg"
  [salvando]="salvando" (fechar)="cancelar()" (salvar)="salvar()">
  <form [formGroup]="form" (ngSubmit)="salvar()" novalidate>
    <div class="formgrid grid">
      <div class="field col-12 md:col-4">
        <label for="lm-data">Data</label>
        <input pInputText id="lm-data" type="date" class="w-full" formControlName="dataMovimentacao"
          [class.ng-dirty]="invalido('dataMovimentacao')" />
        <mf-field-error [control]="form.controls.dataMovimentacao">Informe a data.</mf-field-error>
      </div>

      <div class="field col-12 md:col-4">
        <label for="lm-tipo">Tipo lançamento</label>
        <p-dropdown inputId="lm-tipo" formControlName="tipoLancamento" [options]="['Entrada', 'Saída']" appendTo="body"
          styleClass="w-full" />
      </div>

      <div class="field col-12 md:col-4">
        <label for="lm-valor">Valor</label>
        <input pInputText id="lm-valor" type="text" inputmode="decimal" class="w-full" currencyInput
          formControlName="valor" placeholder="0,00" [class.ng-dirty]="invalido('valor')" />
        <mf-field-error [control]="form.controls.valor">Informe um valor maior que zero.</mf-field-error>
      </div>

      <div class="field col-12 md:col-6">
        <label for="lm-banco">Banco</label>
        <p-dropdown inputId="lm-banco" formControlName="bancoId" [options]="bancos" optionLabel="nomeBanco"
          optionValue="id" placeholder="Selecione..." appendTo="body" styleClass="w-full"
          [class.ng-dirty]="invalido('bancoId')" />
        <mf-field-error [control]="form.controls.bancoId">Selecione o banco.</mf-field-error>
      </div>

      <div class="field col-12 md:col-6">
        <label for="lm-tipo-conta">Tipo conta / cartão</label>
        <input pInputText id="lm-tipo-conta" type="text" class="w-full" [value]="tipoCartao?.nomeTipoCartao ?? '—'"
          disabled />
        <small class="mf-hint">Definido pelo banco.</small>
      </div>

      <ng-container *ngIf="ehCredito">
        <div class="field col-12 md:col-4">
          <label for="lm-fatura">Número da fatura</label>
          <input pInputText id="lm-fatura" maxlength="20" type="text" class="w-full" placeholder="Ex.: 2026-01"
            formControlName="numeroFatura" [class.ng-dirty]="invalido('numeroFatura')" />
          <mf-field-error [control]="form.controls.numeroFatura">Use o formato AAAA-MM.</mf-field-error>
        </div>

        <div class="field col-12 md:col-8 flex align-items-end gap-2 pb-2">
          <p-checkbox inputId="lm-parcelado" formControlName="parcelado" [binary]="true" />
          <label for="lm-parcelado" class="mb-0">Compra parcelada</label>
        </div>

        <ng-container *ngIf="form.controls.parcelado.value">
          <div class="field col-12 md:col-4">
            <label for="lm-total">Total de parcelas</label>
            <input pInputText id="lm-total" type="number" min="2" class="w-full" formControlName="quantidadeParcelas"
              [class.ng-dirty]="invalido('quantidadeParcelas')" />
            <mf-field-error [control]="form.controls.quantidadeParcelas">No mínimo 2 parcelas.</mf-field-error>
          </div>

          <div class="field col-12 md:col-4">
            <label for="lm-parcela">Parcela atual</label>
            <input pInputText id="lm-parcela" type="number" min="1" class="w-full" formControlName="parcelaAtual"
              [class.ng-dirty]="invalido('parcelaAtual') || parcelaForaDoTotal" />
            <!-- Fica um <small> próprio: o erro também vale quando a parcela passa do total, que não é validação do campo. -->
            <small class="p-error" *ngIf="invalido('parcelaAtual') || parcelaForaDoTotal">
              {{ parcelaForaDoTotal ? 'A parcela atual não pode passar do total.' : 'A parcela começa em 1.' }}
            </small>
          </div>

          <div class="field col-12 md:col-4 flex align-items-end gap-2 pb-2">
            <p-checkbox inputId="lm-gerar" formControlName="gerarTodasParcelas" [binary]="true" />
            <label for="lm-gerar" class="mb-0">Gerar as parcelas seguintes</label>
          </div>
        </ng-container>
      </ng-container>

      <div class="field col-12 md:col-6">
        <label for="lm-categoria">Categoria (opcional)</label>
        <p-dropdown inputId="lm-categoria" formControlName="categoriaId" [options]="categorias" optionLabel="nome"
          optionValue="id" placeholder="Selecione..." [showClear]="true" appendTo="body" styleClass="w-full" />
      </div>

      <div class="field col-12 md:col-6">
        <label for="lm-pessoa">Pessoa / estabelecimento</label>
        <p-autoComplete inputId="lm-pessoa" formControlName="pessoa" [suggestions]="sugestoesPessoa"
          (completeMethod)="buscarPessoa($event)" optionLabel="nomePessoa" [forceSelection]="false" appendTo="body"
          styleClass="w-full" inputStyleClass="w-full uppercase" />
      </div>

      <div class="field col-12 md:col-6">
        <label for="lm-descricao">Descrição (opcional)</label>
        <input pInputText id="lm-descricao" maxlength="200" type="text" class="w-full" formControlName="descricao" />
      </div>

      <div class="field col-12">
        <label for="lm-observacao">Observação (opcional)</label>
        <textarea pInputTextarea id="lm-observacao" maxlength="500" class="w-full" rows="3" formControlName="observacao"></textarea>
      </div>
    </div>
  </form>
</mf-form-panel>
