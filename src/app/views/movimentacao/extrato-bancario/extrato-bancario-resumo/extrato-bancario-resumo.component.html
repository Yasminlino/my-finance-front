<div class="pagina">
  <app-data-grid #grid [dataSource]="resumo" [breadcrumb]="breadcrumb" [columns]="gridColumns"
  (reload)="loadMonth($event)" [titulo]="'Resumo de Extratos Bancários'" [dateFilter]="dateFilter" [itemsButtom]="itemsButtom"
  [exibeCampos]="exibirCampos" [loading]="loading" (edit)="onEdit($event)">
</app-data-grid>
  <!-- IMPORTAÇÃO DE EXTRATO (ARQUIVO) -->
  <app-modal-importar-extrato *ngIf="showImportModal" [bancos]="bancos" [tiposCartao]="tiposConta"
    (fechado)="onImportacaoFechada($event)">
  </app-modal-importar-extrato>

  <!-- LANÇAMENTO MANUAL (banco escolhido no formulário) -->
  <app-modal-lancamento-manual *ngIf="showManualModal" [mes]="selectedMonth" [bancos]="bancos"
    [tiposCartao]="tiposConta" [categorias]="categorias" [pessoas]="pessoas"
    (fechado)="onLancamentoManualFechado($event)">
  </app-modal-lancamento-manual>

  <!-- MODAIS EXTERNOS (FORA DO CONTAINER DA MODAL MANUAL) -->
  <app-modal-importacoes-mensais *ngIf="showModalImportacoesMensais" [monthFilter]="selectedMonth"
    (closed)="showModalImportacoesMensais = false; loadMonth()">
  </app-modal-importacoes-mensais>

  <app-modal-configuracao-vinculo-pessoa *ngIf="showModalConfigPessoas" 
    (closed)="showModalConfigPessoas = false; loadMonth()">
  </app-modal-configuracao-vinculo-pessoa>
</div>
