<p-dialog header="Registrar" [visible]="true" [modal]="true" [dismissableMask]="true" [draggable]="false"
  styleClass="mf-dialog-sm" (visibleChange)="close()">
  <p class="text-color-secondary m-0">Aqui você coloca seu formulário de cadastro.</p>

  <ng-template pTemplate="footer">
    <p-button label="Cancelar" severity="secondary" [outlined]="true" (onClick)="close()" />
    <p-button label="Salvar" icon="pi pi-check" (onClick)="close()" />
  </ng-template>
</p-dialog>
