<app-moldura-acesso>
  <h1 class="titulo">Entrar</h1>
  <p class="subtitulo">Que bom te ver de novo.</p>

  <p-message *ngIf="aviso && !erroLogin && !naoConfirmado" severity="success" styleClass="w-full mb-3" [text]="aviso" />
  <p-message *ngIf="sessaoExpirada && !aviso && !erroLogin && !naoConfirmado" severity="info" styleClass="w-full mb-3"
    text="Sua sessão expirou. Entre de novo para continuar." />
  <p-message *ngIf="erroLogin" severity="error" styleClass="w-full mb-3" [text]="erroLogin" />

  <!-- Card #50: senha certa, e-mail ainda não confirmado -->
  <div *ngIf="naoConfirmado" class="flex flex-column align-items-start gap-1 mb-3">
    <p-message severity="warn" styleClass="w-full"
      [text]="reenviado ? 'Enviamos um novo link. Confira sua caixa de entrada e o spam.' : 'Confirme seu e-mail para entrar.'" />
    <p-button *ngIf="!reenviado" label="Reenviar link" icon="pi pi-envelope" [text]="true" size="small"
      [loading]="reenviando" (onClick)="reenviarConfirmacao()" />
  </div>

  <form (ngSubmit)="submit()" [formGroup]="form" autocomplete="on" novalidate class="flex flex-column gap-3">
    <div class="flex flex-column gap-2">
      <label for="username" class="rotulo">E-mail ou usuário</label>
      <p-iconField iconPosition="left">
        <p-inputIcon styleClass="pi pi-user" />
        <input pInputText id="username" type="text" formControlName="username" autocomplete="username"
          autocapitalize="none" placeholder="seu usuário ou voce@email.com" class="w-full"
          [class.ng-invalid]="!!erro('username')" [class.ng-dirty]="!!erro('username')" />
      </p-iconField>
      <small class="p-error" *ngIf="erro('username')">{{ erro('username') }}</small>
    </div>

    <div class="flex flex-column gap-2">
      <label for="password" class="rotulo">Senha</label>
      <p-iconField iconPosition="left" class="campo-senha">
        <p-inputIcon styleClass="pi pi-lock" />
        <p-password inputId="password" formControlName="password" [toggleMask]="true" [feedback]="false"
          placeholder="Sua senha" autocomplete="current-password" styleClass="w-full" inputStyleClass="w-full"
          [class.ng-invalid]="!!erro('password')" [class.ng-dirty]="!!erro('password')"
          (keyup)="verificarCapsLock($event)" (keydown)="verificarCapsLock($event)" (focusout)="capsLock = false" />
      </p-iconField>
      <small class="p-error" *ngIf="erro('password')">{{ erro('password') }}</small>
      <small class="caps-lock" *ngIf="capsLock"><i class="pi pi-exclamation-triangle"></i> Caps Lock está ativado</small>
    </div>

    <div class="flex align-items-center justify-content-between gap-2 flex-wrap">
      <div class="flex align-items-center gap-2">
        <p-checkbox inputId="remember" formControlName="remember" [binary]="true" />
        <label for="remember">Lembrar de mim</label>
      </div>
      <a routerLink="/login/recuperar-senha" class="link">Esqueci a senha</a>
    </div>

    <p-button type="submit" [label]="loading ? 'Entrando...' : 'Entrar'" [loading]="loading" styleClass="w-full botao" />
  </form>

  <p-divider align="center"><span class="text-color-secondary">ou</span></p-divider>

  <p-button label="Criar uma conta" [outlined]="true" styleClass="w-full botao" routerLink="/login/cadastro" />
</app-moldura-acesso>
