<div class="mf-pagina">
  @if (arquivado) {
    <p-message severity="warn" styleClass="w-full justify-content-start mb-3" text="Planejamento arquivado — desarquive para editar." />
  }
    <app-data-grid #grid [dataSource]="itensLista" [breadcrumb]="breadcrumb" [columns]="gridColumns" [titulo]="titulo" [statusOptions]="statusOptions" campoStatus="feito"
        [exibeCampos]="exibirCampos" [loading]="loading" (edit)="onEdit($event)" (new)="openCreate()"  (selectionChange)="onSelectionChange($event)"
        (delete)="onDelete($event)" (deleteSelected)="onDeleteSelected($event)">

        <app-totais-selecao [receita]="selectedTotals.receita" [despesa]="selectedTotals.despesa"
            [saldo]="selectedTotals.saldo" [count]="selectedTotals.count"></app-totais-selecao>

    </app-data-grid>
    <!-- Criar Item -->
    <app-modal-novo-item-lista *ngIf="showModalCreateItem" [listaId]="listaId" [campos]="campos" [item]="null"
        (closed)="closeCreate($event)">
    </app-modal-novo-item-lista>

    <!-- Editar Item -->
    <app-modal-novo-item-lista *ngIf="showModalUpdateItem" [listaId]="listaId" [campos]="campos" [item]="editing"
        (closed)="closeEdit($event)">
    </app-modal-novo-item-lista>

</div>
