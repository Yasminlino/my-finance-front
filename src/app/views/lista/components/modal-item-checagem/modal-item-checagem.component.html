<p-dialog [header]="isEdit ? 'Editar Item' : 'Novo Item de Checagem'" [visible]="true" [modal]="true"
  [draggable]="false" [style]="{ width: '32rem' }" [breakpoints]="{ '576px': '95vw' }" (visibleChange)="fechar()">
  <form [formGroup]="form" class="flex flex-column gap-3" (ngSubmit)="salvar()" novalidate>
    <div *ngIf="errorMsg" class="p-3 border-round bg-red-50 text-red-700">{{ errorMsg }}</div>

    <div class="flex flex-column gap-2">
      <label for="ic-descricao">Descrição</label>
      <input pInputText id="ic-descricao" maxlength="200" formControlName="descricao" [class.ng-dirty]="invalido('descricao')" />
      <small class="p-error" *ngIf="invalido('descricao')">Informe a descrição.</small>
    </div>

    <div class="flex flex-column gap-2">
      <label for="ic-quantidade">Quantidade</label>
      <input pInputText id="ic-quantidade" type="number" min="1" formControlName="quantidade"
        [class.ng-dirty]="invalido('quantidade')" />
      <small class="p-error" *ngIf="invalido('quantidade')">A quantidade mínima é 1.</small>
    </div>

    <div class="flex align-items-center gap-2">
      <p-checkbox inputId="ic-concluido" formControlName="concluido" [binary]="true" />
      <label for="ic-concluido">Concluído</label>
    </div>
  </form>

  <ng-template pTemplate="footer">
    <p-button label="Cancelar" severity="secondary" [outlined]="true" (onClick)="fechar()" />
    <p-button label="Salvar" icon="pi pi-check" [loading]="loading" (onClick)="salvar()" />
  </ng-template>
</p-dialog>
