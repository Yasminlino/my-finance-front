<div class="modal-backdrop fade show"></div>

<div class="modal d-block">
  <div class="modal-dialog modal-dialog-centered">
    <form class="modal-content" [formGroup]="form" (ngSubmit)="salvar()" novalidate>

      <div class="modal-header">
        <h5 class="modal-title">
          {{ isEdit ? 'Editar Item' : 'Novo Item de Checagem' }}
        </h5>

        <button type="button" class="btn-close" (click)="fechar()"></button>
      </div>

      <div class="modal-body">

        <div *ngIf="errorMsg" class="alert alert-danger">
          {{ errorMsg }}
        </div>

        <div class="mb-3">
          <label class="form-label" for="ic-descricao">Descrição</label>
          <input id="ic-descricao" class="form-control" formControlName="descricao"
                 [class.is-invalid]="invalido('descricao')">
          <div class="invalid-feedback">Informe a descrição.</div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="ic-quantidade">Quantidade</label>
          <input id="ic-quantidade" class="form-control" type="number" min="1" formControlName="quantidade"
                 [class.is-invalid]="invalido('quantidade')">
          <div class="invalid-feedback">A quantidade mínima é 1.</div>
        </div>

        <div class="form-check">
          <input id="ic-concluido" type="checkbox" class="form-check-input" formControlName="concluido">
          <label class="form-check-label" for="ic-concluido">
            Concluído
          </label>
        </div>

      </div>

      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" (click)="fechar()">
          Cancelar
        </button>

        <button type="submit" class="btn btn-primary" [disabled]="loading">
          {{ loading ? 'Salvando...' : 'Salvar' }}
        </button>
      </div>

    </form>
  </div>
</div>
