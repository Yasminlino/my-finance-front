<div class="modal-backdrop fade show"></div>

<div class="modal d-block">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">
          {{ isEdit ? 'Editar Item' : 'Novo Item de Checagem' }}
        </h5>

        <button type="button" class="btn-close" (click)="fechar()"></button>
      </div>

      <div class="modal-body">

        <div *ngIf="errorMsg" class="alert alert-danger">
          {{ errorMsg }}
        </div>

        <div class="mb-3">
          <label class="form-label">Descrição</label>
          <input class="form-control"
                 [(ngModel)]="form.descricao">
        </div>
        <div class="mb-3">
          <label class="form-label">Quantidade</label>
          <input class="form-control" type="number"
                 [(ngModel)]="form.quantidade">
        </div>

        <div class="form-check">
          <input type="checkbox"
                 class="form-check-input"
                 [checked]="form.status === 'CONCLUIDO'"
                 (change)="toggleStatus()">

          <label class="form-check-label">
            Concluído
          </label>
        </div>

      </div>

      <div class="modal-footer">
        <button class="btn btn-outline-secondary" (click)="fechar()">
          Cancelar
        </button>

        <button class="btn btn-primary"
                [disabled]="loading"
                (click)="salvar()">
          {{ loading ? 'Salvando...' : 'Salvar' }}
        </button>
      </div>

    </div>
  </div>
</div>
