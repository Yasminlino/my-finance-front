<mf-form-panel [titulo]="lista ? 'Editar Lista' : 'Nova Lista'" [salvando]="saving" (fechar)="close(false)"
  (salvar)="save()">
  <form [formGroup]="form" class="flex flex-column gap-3" (ngSubmit)="save()">
    <div class="flex flex-column gap-2">
      <label for="lista-nome">Nome Lista</label>
      <input pInputText id="lista-nome" maxlength="120" formControlName="nome" [class.ng-dirty]="erro('nome')" />
      <mf-field-error [control]="form.controls.nome">Informe um nome válido.</mf-field-error>
    </div>

    <div class="flex flex-column gap-2">
      <label for="lista-modelo">Modelo</label>
      <p-dropdown inputId="lista-modelo" formControlName="modelo" [options]="opcoesModelo"
        placeholder="Selecione..." appendTo="body" styleClass="w-full" [class.ng-dirty]="erro('modelo')" />
      <mf-field-error [control]="form.controls.modelo">Selecione um modelo.</mf-field-error>
    </div>
  </form>
</mf-form-panel>
