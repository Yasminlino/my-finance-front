<mf-form-panel [titulo]="lista ? 'Editar Lista' : 'Nova Lista'" [salvando]="saving" (fechar)="close(false)"
  (salvar)="save()">
  <form [formGroup]="form" class="flex flex-column gap-3" (ngSubmit)="save()">
    <div class="flex flex-column gap-2">
      <label for="lista-nome">Nome Lista</label>
      <input pInputText id="lista-nome" maxlength="120" formControlName="nome" [class.ng-dirty]="erro('nome')" />
      <mf-field-error [control]="form.controls.nome">Informe um nome válido.</mf-field-error>
    </div>

    <div class="flex flex-column gap-2">
      <label for="lista-tipo">Tipo Lista</label>
      <p-dropdown inputId="lista-tipo" formControlName="tipoMovimentacao" [options]="opcoesTipo"
        placeholder="Selecione..." appendTo="body" styleClass="w-full" [class.ng-dirty]="erro('tipoMovimentacao')" />
      <mf-field-error [control]="form.controls.tipoMovimentacao">Selecione um tipo de Lista.</mf-field-error>
    </div>

    <div class="flex flex-column gap-2">
      <label for="lista-status">Status</label>
      <p-dropdown inputId="lista-status" formControlName="status" [options]="opcoesStatus" appendTo="body"
        styleClass="w-full" />
    </div>
  </form>
</mf-form-panel>
