<p-dialog [header]="lista ? 'Editar Lista' : 'Nova Lista'" [visible]="true" [modal]="true" [dismissableMask]="true"
  [draggable]="false" [style]="{ width: '32rem' }" [breakpoints]="{ '576px': '95vw' }" (visibleChange)="close(false)">
  <form [formGroup]="form" class="flex flex-column gap-3" (ngSubmit)="save()">
    <div class="flex flex-column gap-2">
      <label for="lista-nome">Nome Lista</label>
      <input pInputText id="lista-nome" formControlName="nome" [class.ng-dirty]="erro('nome')" />
      <small class="p-error" *ngIf="erro('nome')">Informe um nome válido.</small>
    </div>

    <div class="flex flex-column gap-2">
      <label for="lista-tipo">Tipo Lista</label>
      <p-dropdown inputId="lista-tipo" formControlName="tipoMovimentacao" [options]="opcoesTipo"
        placeholder="Selecione..." appendTo="body" styleClass="w-full" [class.ng-dirty]="erro('tipoMovimentacao')" />
      <small class="p-error" *ngIf="erro('tipoMovimentacao')">Selecione um tipo de Lista.</small>
    </div>

    <div class="flex flex-column gap-2">
      <label for="lista-status">Status</label>
      <p-dropdown inputId="lista-status" formControlName="status" [options]="opcoesStatus" appendTo="body"
        styleClass="w-full" />
    </div>
  </form>

  <ng-template pTemplate="footer">
    <p-button label="Cancelar" severity="secondary" [outlined]="true" (onClick)="close(false)" />
    <p-button label="Salvar" icon="pi pi-check" [loading]="saving" (onClick)="save()" />
  </ng-template>
</p-dialog>
