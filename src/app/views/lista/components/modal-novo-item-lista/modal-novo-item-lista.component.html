<mf-form-panel [titulo]="item ? 'Editar Item' : 'Novo Item'" [salvando]="saving" (fechar)="close(false)"
  (salvar)="save()">
  <form [formGroup]="form" class="flex flex-column gap-3" (ngSubmit)="save()">
    <div *ngIf="alert.type" class="p-3 border-round"
      [ngClass]="alert.type === 'success' ? 'bg-green-50 text-green-700' : 'bg-red-50 text-red-700'">
      {{ alert.message }}
    </div>

    <div class="flex flex-column gap-2">
      <label for="item-descricao">Descrição</label>
      <input pInputText id="item-descricao" maxlength="200" formControlName="descricao" [class.ng-dirty]="erro('descricao')" />
      <mf-field-error [control]="form.controls.descricao">Informe uma descrição válida.</mf-field-error>
    </div>

    <div class="flex flex-column gap-2" *ngIf="campos.usaQuantidade">
      <label for="item-quantidade">Quantidade</label>
      <input pInputText id="item-quantidade" type="number" min="1" formControlName="quantidade"
        [class.ng-dirty]="erro('quantidade')" />
      <mf-field-error [control]="form.controls.quantidade">Quantidade deve ser no mínimo 1.</mf-field-error>
    </div>

    <div class="flex flex-column gap-2">
      <label for="item-valor">Valor</label>
      <input pInputText id="item-valor" type="text" inputmode="decimal" formControlName="valor" currencyInput
        placeholder="0,00" [class.ng-dirty]="erro('valor')" />
      <mf-field-error [control]="form.controls.valor">Informe um valor.</mf-field-error>
    </div>

    <div class="flex flex-column gap-2">
      <label for="item-observacao">Observação</label>
      <input pInputText id="item-observacao" maxlength="500" formControlName="observacao" [class.ng-dirty]="erro('observacao')" />
      <mf-field-error [control]="form.controls.observacao">Informe uma descrição válida.</mf-field-error>
    </div>

    <div class="flex flex-column gap-2">
      <label for="item-feito">Status</label>
      <!-- Feito ou pendente (card #67: AGUARDANDO virou "(aguardando)" na observação). -->
      <p-dropdown inputId="item-feito" formControlName="feito" [options]="opcoesFeito" appendTo="body"
        styleClass="w-full" />
    </div>

    <div class="grid" *ngIf="campos.usaData">
      <div class="col-6 flex flex-column gap-2">
        <label for="item-data">Data Tarefa (opcional)</label>
        <input pInputText id="item-data" type="date" formControlName="data" />
      </div>
      <div class="col-6 flex flex-column gap-2">
        <label for="item-horario">Horário (opcional)</label>
        <input pInputText id="item-horario" type="time" formControlName="hora" />
      </div>
    </div>
  </form>
</mf-form-panel>
