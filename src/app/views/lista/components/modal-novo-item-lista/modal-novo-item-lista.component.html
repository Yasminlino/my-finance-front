<p-dialog [header]="item ? 'Editar Item' : 'Novo Item'" [visible]="true" [modal]="true" [dismissableMask]="true"
  [draggable]="false" [style]="{ width: '36rem' }" [breakpoints]="{ '576px': '95vw' }" (visibleChange)="close(false)">
  <form [formGroup]="form" class="flex flex-column gap-3" (ngSubmit)="save()">
    <div *ngIf="alert.type" class="p-3 border-round"
      [ngClass]="alert.type === 'success' ? 'bg-green-50 text-green-700' : 'bg-red-50 text-red-700'">
      {{ alert.message }}
    </div>

    <div class="flex flex-column gap-2">
      <label for="item-descricao">Descrição</label>
      <input pInputText id="item-descricao" formControlName="descricao" [class.ng-dirty]="erro('descricao')" />
      <small class="p-error" *ngIf="erro('descricao')">Informe uma descrição válida.</small>
    </div>

    <div class="flex flex-column gap-2" *ngIf="tipoLista === 1 || tipoLista === 2">
      <label for="item-quantidade">Quantidade</label>
      <input pInputText id="item-quantidade" type="number" min="1" formControlName="quantidade"
        [class.ng-dirty]="erro('quantidade')" />
      <small class="p-error" *ngIf="erro('quantidade')">Quantidade deve ser no mínimo 1.</small>
    </div>

    <div class="flex flex-column gap-2">
      <label for="item-valor">Valor</label>
      <input pInputText id="item-valor" type="text" inputmode="decimal" formControlName="valor" currencyInput
        placeholder="0,00" [class.ng-dirty]="erro('valor')" />
      <small class="p-error" *ngIf="erro('valor')">Informe um valor.</small>
    </div>

    <div class="flex flex-column gap-2">
      <label for="item-observacao">Observação</label>
      <input pInputText id="item-observacao" formControlName="observacao" [class.ng-dirty]="erro('observacao')" />
      <small class="p-error" *ngIf="erro('observacao')">Informe uma descrição válida.</small>
    </div>

    <div class="flex flex-column gap-2">
      <label for="item-status">Status</label>
      <!-- Mesmo domínio do CHECK de ItemLista.Status (DB-P1-03). -->
      <p-dropdown inputId="item-status" formControlName="status" [options]="opcoesStatus" appendTo="body"
        styleClass="w-full" />
    </div>

    <div class="grid" *ngIf="tipoLista === 2">
      <div class="col-6 flex flex-column gap-2">
        <label for="item-data">Data Tarefa (opcional)</label>
        <input pInputText id="item-data" type="date" formControlName="dataTarefa" />
      </div>
      <div class="col-6 flex flex-column gap-2">
        <label for="item-horario">Horário (opcional)</label>
        <input pInputText id="item-horario" type="time" formControlName="horarioTarefa" />
      </div>
    </div>
  </form>

  <ng-template pTemplate="footer">
    <p-button label="Cancelar" severity="secondary" [outlined]="true" (onClick)="close(false)" />
    <p-button label="Salvar" icon="pi pi-check" [loading]="saving" (onClick)="save()" />
  </ng-template>
</p-dialog>
