<mf-form-panel [titulo]="registro ? 'Editar Categoria' : 'Nova Categoria'" [salvando]="saving" (fechar)="close(false)"
  (salvar)="save()">
  <form [formGroup]="form" class="flex flex-column gap-3" (ngSubmit)="save()">
    <div class="flex flex-column gap-2">
      <label for="categoria-nome">Nome categoria <span class="text-red-500">*</span></label>
      <input pInputText id="categoria-nome" maxlength="120" formControlName="name" placeholder="Preencha o nome da categoria."
        [class.ng-dirty]="erro('name')" />
      <mf-field-error [control]="form.controls.name">Informe um nome válido.</mf-field-error>
    </div>

    <div class="flex flex-column gap-2">
      <label for="categoria-tipo">Tipo Categoria <span class="text-red-500">*</span></label>
      <p-dropdown inputId="categoria-tipo" formControlName="subCategory" [options]="opcoesTipo"
        placeholder="Selecione..." appendTo="body" styleClass="w-full" [class.ng-dirty]="erro('subCategory')" />
      <mf-field-error [control]="form.controls.subCategory">Selecione um tipo categoria.</mf-field-error>
    </div>

    <div class="flex flex-column gap-2" *ngIf="perfilEmpresa ?? form.get('subCategory')?.value != 'Receita'">
      <label for="categoria-natureza">Natureza do gasto</label>
      <p-dropdown inputId="categoria-natureza" formControlName="naturezaOperacao" [options]="opcoesNatureza"
        appendTo="body" styleClass="w-full" />
    </div>

    <div class="flex flex-column gap-2">
      <label for="categoria-status">Status</label>
      <p-dropdown inputId="categoria-status" formControlName="status" [options]="opcoesStatus" appendTo="body"
        styleClass="w-full" />
    </div>
  </form>
</mf-form-panel>
