<div class="container-xl py-3">
   <p-toast></p-toast>
  <app-data-grid #grid [dataSource]="categorias" [breadcrumb]="breadcrumb" [columns]="gridColumns"  [titulo]="'Cadastro de categorias'"
    [statusOptions]="statusOptions" [exibeCampos]="exibirCampos"
    [loading]="loading" (edit)="onEdit($event)" (new)="openCreate()" (delete)="onDelete($event)" (deleteSelected)="onDeleteSelected($event)"></app-data-grid>

  <!-- Modal Form -->
  <app-categoria-form *ngIf="showModalForm" [category]="editing" (closed)="closeForm($event)">
  </app-categoria-form>

</div>
