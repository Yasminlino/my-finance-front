<div class="pagina">
  <app-data-grid #grid [dataSource]="registrosExibidos" [breadcrumb]="breadcrumb" [columns]="gridColumns"  [titulo]="'Cadastro de categorias'"
    [statusOptions]="statusOptions" campoStatus="ativo" [exibeCampos]="exibirCampos"
    [loading]="loading" (edit)="onEdit($event)" (new)="openCreate()" (delete)="onDelete($event)" (deleteSelected)="onDeleteSelected($event)"></app-data-grid>

  <!-- Modal Form -->
  <app-categoria-form *ngIf="showModalForm" [registro]="editing" (closed)="closeForm($event)">
  </app-categoria-form>

</div>
