<p-dialog [header]="registro ? 'Editar Conta' : 'Nova Conta'" [visible]="true" [modal]="true"
  [dismissableMask]="true" [draggable]="false" [style]="{ width: '36rem' }" [breakpoints]="{ '576px': '95vw' }"
  (visibleChange)="close(false)">
  <form [formGroup]="form" class="flex flex-column gap-3" (ngSubmit)="save()">
    <div class="flex flex-column gap-2">
      <label for="conta-nome">Descrição <span class="text-red-500">*</span></label>
      <input pInputText id="conta-nome" formControlName="name" placeholder="Preencha o nome da conta..."
        [class.ng-dirty]="erro('name')" />
      <small class="p-error" *ngIf="erro('name')">Informe um nome válido.</small>
    </div>

    <div class="flex flex-column gap-2">
      <label for="conta-valor">Valor</label>
      <input pInputText id="conta-valor" type="text" inputmode="decimal" formControlName="value" currencyInput
        placeholder="0,00" [class.ng-dirty]="erro('value')" />
      <small class="p-error" *ngIf="erro('value')">Informe um valor.</small>
    </div>

    <div class="flex flex-column gap-2">
      <label for="conta-dias">Dias Vencimentos</label>
      <input pInputText id="conta-dias" type="text" formControlName="dataOperacao" placeholder="Ex: 5, 20"
        (input)="onInputChange(($any($event.target)).value)" (blur)="onDiasChange(($any($event.target)).value)"
        [class.ng-dirty]="erro('value')" />
      <small class="p-error" *ngIf="erro('value')">Informe ao menos um dia de vencimento.</small>
    </div>

    <div class="flex flex-column gap-2">
      <label for="conta-categoria">Categoria <span class="text-red-500">*</span></label>
      <p-dropdown inputId="conta-categoria" formControlName="categoryid" [options]="categories" optionLabel="name"
        optionValue="id" placeholder="Selecione..." appendTo="body" styleClass="w-full"
        [class.ng-dirty]="erro('categoryid')" />
      <small class="p-error" *ngIf="erro('categoryid')">Selecione uma categoria.</small>
    </div>

    <div class="flex align-items-center gap-2">
      <p-checkbox inputId="conta-parcelada" formControlName="ehParcelado" [binary]="true" />
      <label for="conta-parcelada">Conta parcelada</label>
    </div>

    <div class="grid" *ngIf="form.get('ehParcelado')?.value">
      <div class="col-6 flex flex-column gap-2">
        <label for="conta-total-parcelas">Total de parcelas</label>
        <input pInputText id="conta-total-parcelas" type="number" min="2" formControlName="quantidadeParcelas" />
      </div>
      <div class="col-6 flex flex-column gap-2">
        <label for="conta-parcela-atual">Parcela atual</label>
        <input pInputText id="conta-parcela-atual" type="number" min="1" formControlName="parcelaAtual" />
      </div>
    </div>

    <div class="flex flex-column gap-2">
      <label for="conta-status">Status</label>
      <p-dropdown inputId="conta-status" formControlName="status" [options]="opcoesStatus" appendTo="body"
        styleClass="w-full" />
    </div>
  </form>

  <ng-template pTemplate="footer">
    <p-button label="Cancelar" severity="secondary" [outlined]="true" (onClick)="close(false)" />
    <p-button label="Salvar" icon="pi pi-check" [loading]="saving" (onClick)="save()" />
  </ng-template>
</p-dialog>
