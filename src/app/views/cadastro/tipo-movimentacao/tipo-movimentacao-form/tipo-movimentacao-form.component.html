<mf-form-panel [titulo]="registro ? 'Editar Tipo de Movimentação' : 'Novo Tipo de Movimentação'" [salvando]="saving"
  (fechar)="close(false)" (salvar)="save()">
  <form [formGroup]="form" class="flex flex-column gap-3" (ngSubmit)="save()">
    <div class="flex flex-column gap-2">
      <label for="tipo-mov-nome">Tipo Movimentação <span class="text-red-500">*</span></label>
      <input pInputText id="tipo-mov-nome" maxlength="60" formControlName="nomeTipoMovimentacao"
        [class.ng-dirty]="erro('nomeTipoMovimentacao')" />
      <mf-field-error [control]="form.controls.nomeTipoMovimentacao">Informe um nome válido.</mf-field-error>
    </div>

    <div class="flex flex-column gap-2">
      <label for="tipo-mov-descricao">Descrição</label>
      <input pInputText id="tipo-mov-descricao" maxlength="200" formControlName="descricao" />
    </div>
  </form>
</mf-form-panel>
