<p-dialog [header]="registro ? 'Editar Tipo de Movimentação' : 'Novo Tipo de Movimentação'" [visible]="true"
  [modal]="true" [dismissableMask]="true" [draggable]="false" [style]="{ width: '32rem' }"
  [breakpoints]="{ '576px': '95vw' }" (visibleChange)="close(false)">
  <form [formGroup]="form" class="flex flex-column gap-3" (ngSubmit)="save()">
    <div class="flex flex-column gap-2">
      <label for="tipo-mov-nome">Tipo Movimentação <span class="text-red-500">*</span></label>
      <input pInputText id="tipo-mov-nome" formControlName="nomeTipoMovimentacao"
        [class.ng-dirty]="erro('nomeTipoMovimentacao')" />
      <small class="p-error" *ngIf="erro('nomeTipoMovimentacao')">Informe um nome válido.</small>
    </div>

    <div class="flex flex-column gap-2">
      <label for="tipo-mov-descricao">Descrição</label>
      <input pInputText id="tipo-mov-descricao" formControlName="descricao" />
    </div>
  </form>

  <ng-template pTemplate="footer">
    <p-button label="Cancelar" severity="secondary" [outlined]="true" (onClick)="close(false)" />
    <p-button label="Salvar" icon="pi pi-check" [loading]="saving" (onClick)="save()" />
  </ng-template>
</p-dialog>
