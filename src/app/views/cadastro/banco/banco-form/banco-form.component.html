<mf-form-panel [titulo]="registro ? 'Editar Banco' : 'Novo Banco'" [salvando]="saving" (fechar)="close(false)"
  (salvar)="save()">
  <form [formGroup]="form" class="flex flex-column gap-3" (ngSubmit)="save()">
    <div class="flex flex-column gap-2">
      <label for="banco-nome">Nome Banco <span class="text-red-500">*</span></label>
      <input pInputText id="banco-nome" maxlength="120" formControlName="nomeBanco" placeholder="Preencha o nome do banco..."
        [class.ng-dirty]="erro('nomeBanco')" />
      <mf-field-error [control]="form.controls.nomeBanco">Informe um nome válido.</mf-field-error>
    </div>

    <div class="flex flex-column gap-2">
      <label for="banco-tipo">Tipo Cartão <span class="text-red-500">*</span></label>
      <p-dropdown inputId="banco-tipo" formControlName="tipoCartaoId" [options]="tiposCartao" optionLabel="nomeTipoCartao"
        optionValue="id" placeholder="Selecione..." appendTo="body" styleClass="w-full"
        [class.ng-dirty]="erro('tipoCartaoId')" />
      <mf-field-error [control]="form.controls.tipoCartaoId">Selecione um tipo de cartão.</mf-field-error>
    </div>

    <div class="flex flex-column gap-2">
      <label for="banco-saldo">Saldo Inicial</label>
      <input pInputText id="banco-saldo" type="text" inputmode="decimal" formControlName="saldoInicial" currencyInput
        placeholder="0,00" [class.ng-dirty]="erro('saldoInicial')" />
      <mf-field-error [control]="form.controls.saldoInicial">Informe um valor.</mf-field-error>
    </div>

    <div class="flex flex-column gap-2">
      <label for="banco-status">Status</label>
      <p-dropdown inputId="banco-status" formControlName="ativo" [options]="opcoesStatus" appendTo="body"
        styleClass="w-full" />
    </div>
  </form>
</mf-form-panel>
