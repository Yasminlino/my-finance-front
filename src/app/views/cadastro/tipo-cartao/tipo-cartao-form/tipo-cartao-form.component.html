<p-dialog [header]="registro ? 'Editar Tipo Cartão' : 'Novo Tipo Cartão'" [visible]="true" [modal]="true"
  [dismissableMask]="true" [draggable]="false" [style]="{ width: '32rem' }" [breakpoints]="{ '576px': '95vw' }"
  (visibleChange)="close(false)">
  <form [formGroup]="form" class="flex flex-column gap-3" (ngSubmit)="save()">
    <div class="flex flex-column gap-2">
      <label for="tipo-cartao-nome">Nome do Tipo Cartão <span class="text-red-500">*</span></label>
      <input pInputText id="tipo-cartao-nome" maxlength="60" formControlName="nomeTipoCartao" [class.ng-dirty]="erro('nomeTipoCartao')" />
      <small class="p-error" *ngIf="erro('nomeTipoCartao')">Informe um nome válido (mínimo 2 caracteres).</small>
    </div>

    <div class="flex align-items-start gap-2">
      <p-checkbox inputId="tipo-cartao-credito" formControlName="ehCredito" [binary]="true" />
      <label for="tipo-cartao-credito" class="flex flex-column gap-1">
        <span>É cartão de crédito</span>
        <small class="text-color-secondary">Os lançamentos aparecem pela fatura, não pela data da compra.</small>
      </label>
    </div>
  </form>

  <ng-template pTemplate="footer">
    <p-button label="Cancelar" severity="secondary" [outlined]="true" (onClick)="close(false)" />
    <p-button label="Salvar" icon="pi pi-check" [loading]="saving" (onClick)="save()" />
  </ng-template>
</p-dialog>
